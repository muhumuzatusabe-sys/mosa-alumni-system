version: '3.8'

services:
  mosa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mosa-alumni-portal
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
